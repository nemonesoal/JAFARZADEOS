name: Build JAFARZADEOS ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build ISO
        run: sudo ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: JAFARZADEOS-1.1-ISO
          path: "**/*.iso"
          if-no-files-found: error
          retention-days: 7
